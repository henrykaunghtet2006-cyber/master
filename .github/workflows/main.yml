name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Check Java version
        run: java -version

      - name: Setup Docker network
        run: |
          docker network create --driver bridge se-methods

      - name: Start MongoDB
        run: |
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo
          sleep 15

      - name: Build with Maven
        run: mvn clean package

      - name: Verify JAR was built
        run: ls -la target/

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run application
        run: |
          docker run --network se-methods --name devopscontainer devopsimage

      - name: View MongoDB logs
        if: always()
        run: docker logs mongo-dbserver || true

      - name: View application logs
        if: always()
        run: docker logs devopscontainer || true