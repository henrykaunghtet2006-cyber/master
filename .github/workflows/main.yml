name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Check Java version
        run: java -version

      - name: Setup Docker network
        run: |
          docker network create --driver bridge se-methods

      - name: Start MongoDB
        run: |
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if docker exec mongo-dbserver mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep -q 1; then
              echo "MongoDB is ready"
              exit 0
            fi
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB failed to start"
          docker logs mongo-dbserver
          exit 1

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run application
        run: |
          docker run --network se-methods --name devopscontainer devopsimage

      - name: View MongoDB logs
        if: always()
        run: docker logs mongo-dbserver

      - name: View application logs
        if: always()
        run: docker logs devopscontainer